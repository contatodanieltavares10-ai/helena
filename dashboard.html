<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="flex h-screen bg-gray-50 font-sans">
    <aside class="w-64 bg-white border-r hidden md:flex flex-col">
        <div class="p-6 font-bold text-xl text-green-600 flex gap-2 items-center"><i data-lucide="flower-2"></i> Dra. Elena</div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="flex gap-3 px-4 py-3 bg-green-50 text-green-700 rounded-lg font-bold"><i data-lucide="home"></i> Início</a>
            <a href="perfil.html" class="flex gap-3 px-4 py-3 text-gray-600 hover:bg-gray-100 font-bold"><i data-lucide="user"></i> Perfil</a>
        </nav>
        <div class="p-4">
            <button onclick="sairNaMarra()" class="w-full flex gap-3 px-4 py-3 text-red-500 border border-red-100 rounded-lg font-bold"><i data-lucide="log-out"></i> SAIR</button>
        </div>
    </aside>

    <div class="flex-1 p-8">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold">Visão Geral</h1>
            <div class="text-right">
                <p class="text-xs text-gray-400 font-bold">OLÁ</p>
                <p id="user-name" class="font-bold">Carregando...</p>
            </div>
        </header>
        <div class="bg-green-600 text-white p-8 rounded-2xl shadow-lg">
            <h2 class="text-2xl font-bold mb-2">Sessão Online</h2>
            <button class="bg-white text-green-700 px-6 py-3 rounded-lg font-bold mt-4">Acessar</button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const supabase = window.supabase.createClient('https://qpgtvcjcpucqwobmfozv.supabase.co', 'sb_publishable_yEvcZWITTevvnElw6wwdRg_usqiJNwW');

        // --- CÓDIGO DO GPT: CHECAGEM DE SESSÃO ---
        (async () => {
            const { data } = await supabase.auth.getSession();
            if (!data.session) {
                window.location.href = 'area-paciente.html';
                return;
            }
            // Carrega nome
            const { data: userData } = await supabase.auth.getUser();
            const meta = userData.user.user_metadata;
            if (meta && meta.full_name) {
                document.getElementById('user-name').innerText = meta.full_name;
            }
        })();

        // --- CÓDIGO DO GPT: SAIR NA MARRA ---
        window.sairNaMarra = async function() {
            await supabase.auth.signOut(); // PRIMEIRO
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = 'area-paciente.html'; // POR ÚLTIMO
        }
    </script>
</body>
</html>
