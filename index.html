<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dra. Elena Silva | Psicologia Clínica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4CAF4F',
                        primaryDark: '#388E3C',
                        secondary: '#263238',
                        gray: '#717171',
                        silver: '#F5F7FA',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }
        #mobile-menu { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); max-height: 0; opacity: 0; visibility: hidden; transform: translateY(-20px); overflow: hidden; }
        #mobile-menu.open { max-height: 500px; opacity: 1; visibility: visible; transform: translateY(0); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .hamburger line { transition: transform 0.3s ease, opacity 0.3s ease; transform-origin: center; }
        .hamburger.active line:nth-child(1) { transform: translateY(6px) rotate(45deg); }
        .hamburger.active line:nth-child(2) { opacity: 0; transform: translateX(-10px); }
        .hamburger.active line:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
        .testimonial-card { transition: transform 0.3s ease; }
        .testimonial-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-white text-secondary">

    <nav class="bg-white/95 backdrop-blur-md py-4 fixed w-full z-50 shadow-sm transition-all duration-300" id="navbar">
        <div class="container mx-auto px-6 flex justify-between items-center relative z-50 bg-white/95">
            <a href="#" class="flex items-center gap-2 group">
                <div class="p-2.5 bg-green-50 rounded-full group-hover:bg-green-100 transition duration-300 border border-green-100">
                    <svg class="w-6 h-6 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 21v-16"></path>
                        <path d="M12 13a5 5 0 0 0 5-5v-3"></path>
                        <path d="M12 13a5 5 0 0 1-5-5v-3"></path>
                    </svg>
                </div>
                <span class="text-xl md:text-2xl font-bold text-secondary tracking-tight">Dra. Elena <span class="text-primary">Silva</span></span>
            </a>
            <div class="hidden md:flex gap-8 text-secondary font-medium items-center">
                <a href="#" class="hover:text-primary transition relative group">Início</a>
                <a href="#servicos" class="hover:text-primary transition relative group">Especialidades</a>
                <a href="#sobre" class="hover:text-primary transition relative group">Sobre</a>
                <a href="#depoimentos" class="hover:text-primary transition relative group">Depoimentos</a>
                <a href="#contato" class="bg-primary text-white px-6 py-2.5 rounded-lg hover:bg-primaryDark transition shadow-md">Agendar Consulta</a>
            </div>
            <button id="menu-btn" class="md:hidden text-secondary focus:outline-none p-2 rounded-md hover:bg-gray-100 transition">
                <svg class="w-8 h-8 hamburger" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="4" y1="6" x2="20" y2="6" />
                    <line x1="4" y1="12" x2="20" y2="12" />
                    <line x1="4" y1="18" x2="20" y2="18" />
                </svg>
            </button>
        </div>
        <div id="mobile-menu" class="absolute top-full left-0 w-full bg-white border-t border-gray-100 md:hidden z-40">
            <div class="flex flex-col p-6 gap-4 text-center font-medium">
                <a href="#" class="hover:text-primary py-3 block mobile-link border-b">Início</a>
                <a href="#servicos" class="hover:text-primary py-3 block mobile-link border-b">Especialidades</a>
                <a href="#sobre" class="hover:text-primary py-3 block mobile-link border-b">Sobre</a>
                <a href="#depoimentos" class="hover:text-primary py-3 block mobile-link border-b">Depoimentos</a>
                <a href="#contato" class="bg-primary text-white px-6 py-4 rounded-lg mt-4 shadow-lg">Agendar Consulta</a>
            </div>
        </div>
    </nav>

    <script>
        const btn = document.getElementById('menu-btn');
        const menu = document.getElementById('mobile-menu');
        const hamburgerIcon = document.querySelector('.hamburger');
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            menu.classList.toggle('open');
            hamburgerIcon.classList.toggle('active');
        });
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.15 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
