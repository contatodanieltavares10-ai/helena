<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Perfil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-50 px-4 font-sans">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">Editar Perfil</h2>
            <a href="dashboard.html" class="font-bold text-gray-400 hover:text-green-600">Voltar</a>
        </div>

        <div class="space-y-6">
            <div class="flex flex-col items-center">
                <img id="preview-img" src="https://via.placeholder.com/150" class="w-32 h-32 rounded-full object-cover border-4 border-gray-100 mb-4 cursor-pointer" onclick="document.getElementById('file-upload').click()">
                <input type="file" id="file-upload" class="hidden" accept="image/*" onchange="previewFile(this)">
                <p class="text-xs text-gray-400">Clique na foto para alterar</p>
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">Nome Completo</label>
                <input type="text" id="input-nome" class="w-full p-3 border rounded-lg font-bold">
            </div>
            <button onclick="salvar()" id="btn-save" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700">Salvar Alterações</button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const supabase = window.supabase.createClient('https://qpgtvcjcpucqwobmfozv.supabase.co', 'sb_publishable_yEvcZWITTevvnElw6wwdRg_usqiJNwW');
        let arquivoParaEnviar = null;

        // Carregar dados (Lógica do GPT: getUser + metadata)
        (async () => {
            const { data } = await supabase.auth.getUser();
            if (data?.user?.user_metadata) {
                const meta = data.user.user_metadata;
                document.getElementById('input-nome').value = meta.full_name || '';
                document.getElementById('preview-img').src = meta.avatar_url || 'https://via.placeholder.com/150';
            }
        })();

        function previewFile(input) {
            if (input.files && input.files[0]) {
                arquivoParaEnviar = input.files[0];
                const reader = new FileReader();
                reader.onload = (e) => document.getElementById('preview-img').src = e.target.result;
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function salvar() {
            const btn = document.getElementById('btn-save');
            const nome = document.getElementById('input-nome').value;
            btn.innerText = "Salvando...";
            btn.disabled = true;

            try {
                // --- CÓDIGO DO GPT: PEGAR SESSION ID E MONTAR CAMINHO ---
                const { data: sessionData } = await supabase.auth.getSession();
                
                let publicUrl = document.getElementById('preview-img').src;

                if (arquivoParaEnviar && sessionData.session) {
                    const userId = sessionData.session.user.id;
                    const nomeArquivo = `${userId}/avatar.jpg`; // Caminho exato solicitado

                    // Upload com upsert (GPT)
                    const { error } = await supabase.storage
                        .from('avatars')
                        .upload(nomeArquivo, arquivoParaEnviar, { upsert: true });

                    if (error) throw error;

                    // Pega URL pública (com timestamp para forçar atualização visual)
                    const { data: urlData } = supabase.storage.from('avatars').getPublicUrl(nomeArquivo);
                    publicUrl = urlData.publicUrl + '?t=' + new Date().getTime();
                }

                // Atualiza Metadados (GPT)
                const { error: updateError } = await supabase.auth.updateUser({
                    data: { full_name: nome, avatar_url: publicUrl }
                });

                if (updateError) throw updateError;

                alert("Salvo com sucesso!");
                window.location.href = 'dashboard.html';

            } catch (error) {
                alert("Erro: " + error.message);
                btn.disabled = false;
                btn.innerText = "Salvar";
            }
        }
    </script>
</body>
</html>
