<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Paciente | Dra. Elena Silva</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4CAF4F',
                        primaryDark: '#388E3C',
                        secondary: '#263238',
                        surface: '#F8FAFC',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F8FAFC; color: #1e293b; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); transition: all 0.3s ease; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="container mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-green-50 p-2.5 rounded-xl text-primary"><i data-lucide="flower-2" class="w-6 h-6"></i></div>
                <div>
                    <h1 class="font-bold text-secondary text-lg leading-none">Dra. Elena Silva</h1>
                    <span class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Portal do Paciente</span>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <div class="hidden md:block text-right">
                    <p class="text-xs text-gray-400 font-bold uppercase">Conectado como</p>
                    <p class="text-sm font-semibold text-secondary" id="header-email">...</p>
                </div>
                <div class="h-8 w-px bg-gray-200 hidden md:block"></div>
                <button id="btn-logout" class="flex items-center gap-2 text-gray-600 hover:text-red-600 font-medium transition-colors px-3 py-2 rounded-lg hover:bg-red-50">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                    <span class="hidden md:inline">Sair</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-6 py-10 space-y-12">
        <section class="grid lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 bg-secondary rounded-2xl p-8 text-white relative overflow-hidden shadow-2xl group">
                <div class="absolute top-0 right-0 w-96 h-96 bg-primary/20 rounded-full blur-3xl -mr-20 -mt-20 group-hover:bg-primary/30 transition-all duration-700"></div>
                <div class="relative z-10 flex flex-col h-full justify-between gap-8">
                    <div>
                        <span class="inline-flex items-center gap-1.5 bg-green-500/20 text-green-300 border border-green-500/30 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide">
                            <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> Ao Vivo
                        </span>
                        <h2 class="text-3xl font-bold mt-4">Sala de Terapia Online</h2>
                        <p class="text-gray-300 mt-2">Sua sessão segura está pronta.</p>
                    </div>
                    <div class="flex flex-wrap gap-4">
                        <button class="bg-primary hover:bg-primaryDark text-white px-8 py-4 rounded-xl font-bold text-lg transition-all shadow-lg flex items-center gap-3 hover:-translate-y-1">
                            <i data-lucide="play" class="w-5 h-5 fill-current"></i> Entrar na Sessão
                        </button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-8 border border-gray-200 shadow-sm flex flex-col justify-between">
                <div>
                    <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center mb-6"><i data-lucide="activity" class="w-6 h-6"></i></div>
                    <h3 class="text-xl font-bold text-gray-800">Jornada Emocional</h3>
                    <p class="text-gray-500 mt-2 text-sm">Constância de 4 sessões mensais.</p>
                </div>
                <div class="mt-8">
                    <div class="flex justify-between text-xs font-bold text-gray-400 mb-2 uppercase"><span>Progresso</span><span>80%</span></div>
                    <div class="w-full bg-gray-100 rounded-full h-3"><div class="bg-blue-500 h-full rounded-full" style="width: 80%"></div></div>
                </div>
            </div>
        </section>

        <section>
            <div class="flex items-center gap-3 mb-6"><i data-lucide="wrench" class="w-6 h-6 text-primary"></i><h3 class="text-2xl font-bold text-gray-800">Ferramentas</h3></div>
            <div class="grid md:grid-cols-4 gap-6">
                <a href="#" class="bg-white p-6 rounded-2xl border border-gray-200 card-hover group">
                    <div class="w-10 h-10 bg-purple-50 text-purple-600 rounded-lg flex items-center justify-center mb-4 group-hover:bg-purple-600 group-hover:text-white transition-colors"><i data-lucide="book-open" class="w-5 h-5"></i></div>
                    <h4 class="font-bold text-gray-800">Diário de Emoções</h4>
                </a>
                <a href="#" class="bg-white p-6 rounded-2xl border border-gray-200 card-hover group">
                    <div class="w-10 h-10 bg-orange-50 text-orange-600 rounded-lg flex items-center justify-center mb-4 group-hover:bg-orange-600 group-hover:text-white transition-colors"><i data-lucide="wind" class="w-5 h-5"></i></div>
                    <h4 class="font-bold text-gray-800">Respiração Guiada</h4>
                </a>
                <a href="#" class="bg-white p-6 rounded-2xl border border-gray-200 card-hover group">
                    <div class="w-10 h-10 bg-pink-50 text-pink-600 rounded-lg flex items-center justify-center mb-4 group-hover:bg-pink-600 group-hover:text-white transition-colors"><i data-lucide="heart-handshake" class="w-5 h-5"></i></div>
                    <h4 class="font-bold text-gray-800">SOS Ansiedade</h4>
                </a>
                 <a href="#" class="bg-white p-6 rounded-2xl border border-gray-200 card-hover group">
                    <div class="w-10 h-10 bg-gray-50 text-gray-600 rounded-lg flex items-center justify-center mb-4 group-hover:bg-gray-800 group-hover:text-white transition-colors"><i data-lucide="plus" class="w-5 h-5"></i></div>
                    <h4 class="font-bold text-gray-800">Nova Anotação</h4>
                </a>
            </div>
        </section>
    </main>

    <footer class="bg-white border-t border-gray-200 py-8 mt-12 text-center text-sm text-gray-500">&copy; 2025 Dra. Elena Silva.</footer>

    <script>
        lucide.createIcons();
        const SB_URL = 'https://qpgtvcjcpucqwobmfozv.supabase.co';
        const SB_KEY = 'sb_publishable_yEvcZWITTevvnElw6wwdRg_usqiJNwW';
        const supabase = window.supabase.createClient(SB_URL, SB_KEY);

        // 1. CARREGAR USUÁRIO (LÓGICA HÍBRIDA)
        async function init() {
            // A. Tenta pegar da URL primeiro (Mais rápido e garantido se veio do login)
            const params = new URLSearchParams(window.location.search);
            const emailUrl = params.get('u');
            
            if (emailUrl) {
                document.getElementById('header-email').innerText = emailUrl;
            }

            // B. Tenta confirmar com a sessão real do Supabase
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('header-email').innerText = session.user.email;
            } else if (!emailUrl) {
                // Se não tem nem URL nem Sessão, é visitante
                document.getElementById('header-email').innerText = "Visitante";
            }
        }
        init();

        // 2. LOGOUT NUCLEAR (FUNCIONA SEMPRE)
        document.getElementById('btn-logout').addEventListener('click', async () => {
            const btn = document.getElementById('btn-logout');
            btn.innerHTML = 'Saindo...';
            
            // Limpa armazenamento local do navegador (Remove o token na marra)
            localStorage.clear();
            sessionStorage.clear();

            // Tenta avisar o Supabase (mas não espera se travar)
            try {
                supabase.auth.signOut(); 
            } catch(e) { console.log("Logout forçado"); }

            // Redireciona imediatamente
            window.location.href = 'area-paciente.html';
        });
    </script>
</body>
</html>
