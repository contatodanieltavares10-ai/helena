<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Paciente | Dra. Elena Silva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4CAF4F',
                        primaryDark: '#388E3C',
                        secondary: '#263238',
                        silver: '#F5F7FA',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F5F7FA; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-12">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 relative overflow-hidden">
        
        <div class="absolute top-0 left-0 w-full h-2 bg-primary"></div>

        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-secondary">Área do Paciente</h2>
            <p class="text-gray-500 text-sm mt-1">Dra. Elena Silva • Psicologia Clínica</p>
        </div>

        <div id="auth-container">
            <div class="flex border-b border-gray-200 mb-6">
                <button type="button" id="btn-aba-entrar" class="w-1/2 py-2 text-primary border-b-2 border-primary font-medium transition-colors">Entrar</button>
                <button type="button" id="btn-aba-criar" class="w-1/2 py-2 text-gray-400 font-medium hover:text-primary transition-colors">Criar Conta</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Senha</label>
                    <input type="password" id="password" placeholder="******" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                    <p class="text-xs text-gray-400 mt-1 hidden" id="hint-senha">Mínimo de 6 caracteres</p>
                </div>
                
                <button type="button" id="btn-acao" class="w-full bg-primary text-white py-3 rounded-lg font-bold hover:bg-primaryDark transition shadow-md hover:shadow-lg transform hover:-translate-y-0.5 duration-200">
                    Acessar Área Restrita
                </button>
                
                <div id="msg-box" class="text-center text-sm p-3 rounded-lg hidden"></div>
            </div>
        </div>

        <div id="app-container" class="hidden">
            <div class="bg-green-50 border border-green-100 p-4 rounded-lg mb-6">
                <p class="text-primaryDark font-bold text-sm">Olá! Seja bem-vindo(a).</p>
                <p class="text-xs text-gray-600 mt-1">Logado como: <span id="user-email-display" class="font-mono"></span></p>
            </div>
            <div class="space-y-4">
                <h3 class="font-bold text-secondary text-lg border-b pb-2">Seus Materiais</h3>
                <a href="#" class="flex items-center gap-4 p-4 border border-gray-200 rounded-xl hover:bg-gray-50 transition group">
                    <div class="bg-green-100 p-3 rounded-full text-primary group-hover:bg-primary group-hover:text-white transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <div>
                        <p class="font-bold text-secondary text-sm">Diário de Emoções</p>
                        <p class="text-xs text-gray-500">PDF para download</p>
                    </div>
                </a>
            </div>
            <button id="btn-sair" class="w-full mt-8 py-2 text-gray-500 text-sm hover:text-red-500 transition border border-transparent hover:border-red-100 rounded">Sair da conta</button>
        </div>
        
        <div class="mt-8 pt-6 border-t border-gray-100 text-center">
            <a href="index.html" class="text-xs text-gray-400 hover:text-primary">← Voltar ao site principal</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            
            const SB_URL = 'https://qpgtvcjcpucqwobmfozv.supabase.co';
            const SB_KEY = 'sb_publishable_yEvcZWITTevvnElw6wwdRg_usqiJNwW';
            
            let supabase;
            try {
                supabase = window.supabase.createClient(SB_URL, SB_KEY);
            } catch (err) {
                alert("Erro ao conectar com Supabase.");
                return;
            }

            let isLoginMode = true;

            const btnAbaEntrar = document.getElementById('btn-aba-entrar');
            const btnAbaCriar = document.getElementById('btn-aba-criar');
            const btnAcao = document.getElementById('btn-acao');
            const hintSenha = document.getElementById('hint-senha');
            const msgBox = document.getElementById('msg-box');
            const inputEmail = document.getElementById('email');
            const inputPass = document.getElementById('password');
            const containerAuth = document.getElementById('auth-container');
            const containerApp = document.getElementById('app-container');
            const btnSair = document.getElementById('btn-sair');

            function atualizarAba() {
                msgBox.classList.add('hidden');
                if (isLoginMode) {
                    btnAbaEntrar.className = "w-1/2 py-2 text-primary border-b-2 border-primary font-medium transition-colors";
                    btnAbaCriar.className = "w-1/2 py-2 text-gray-400 font-medium hover:text-primary transition-colors";
                    btnAcao.innerText = "Acessar Área Restrita";
                    hintSenha.classList.add('hidden');
                } else {
                    btnAbaEntrar.className = "w-1/2 py-2 text-gray-400 font-medium hover:text-primary transition-colors";
                    btnAbaCriar.className = "w-1/2 py-2 text-primary border-b-2 border-primary font-medium transition-colors";
                    btnAcao.innerText = "Criar Conta";
                    hintSenha.classList.remove('hidden');
                }
            }

            btnAbaEntrar.addEventListener('click', () => { isLoginMode = true; atualizarAba(); });
            btnAbaCriar.addEventListener('click', () => { isLoginMode = false; atualizarAba(); });

            btnAcao.addEventListener('click', async () => {
                const email = inputEmail.value;
                const password = inputPass.value;

                if (!email || !password) {
                    mostrarMensagem("Preencha e-mail e senha.", "erro");
                    return;
                }

                const textoOriginal = btnAcao.innerText;
                btnAcao.disabled = true;
                btnAcao.innerText = "Processando...";
                msgBox.classList.add('hidden');

                try {
                    if (isLoginMode) {
                        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                    } else {
                        const { data, error } = await supabase.auth.signUp({ email, password });
                        if (error) throw error;
                        mostrarMensagem("Conta criada! Redirecionando...", "sucesso");
                    }
                } catch (error) {
                    console.error(error);
                    let msg = "Erro desconhecido.";
                    if (error.message.includes("Invalid login")) msg = "E-mail ou senha incorretos.";
                    if (error.message.includes("User already registered")) msg = "Este e-mail já possui conta.";
                    if (error.message.includes("Password should be")) msg = "A senha deve ter no mínimo 6 caracteres.";
                    
                    mostrarMensagem(msg, "erro");
                    btnAcao.disabled = false;
                    btnAcao.innerText = textoOriginal;
                }
            });

            btnSair.addEventListener('click', async () => {
                await supabase.auth.signOut();
                window.location.reload();
            });

            // --- AQUI ESTÁ A MÁGICA: O REDIRECIONAMENTO ---
            supabase.auth.onAuthStateChange((event, session) => {
                if (session) {
                    // MUDANÇA: Em vez de mostrar a div escondida, ele vai para o novo arquivo
                    window.location.href = 'dashboard.html';
                } else {
                    containerAuth.classList.remove('hidden');
                    containerApp.classList.add('hidden');
                    btnAcao.disabled = false;
                    if(isLoginMode) btnAcao.innerText = "Acessar Área Restrita";
                }
            });

            function mostrarMensagem(texto, tipo) {
                msgBox.innerText = texto;
                msgBox.classList.remove('hidden');
                if (tipo === 'erro') {
                    msgBox.className = "text-center text-sm p-3 rounded-lg bg-red-50 text-red-600 border border-red-100";
                } else {
                    msgBox.className = "text-center text-sm p-3 rounded-lg bg-green-50 text-green-600 border border-green-100";
                }
            }
        });
    </script>
</body>
</html>
