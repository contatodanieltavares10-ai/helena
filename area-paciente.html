<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Paciente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-50 px-4 font-sans">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-6">Acessar Painel</h2>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="E-mail" class="w-full p-3 border rounded">
            <input type="password" id="password" placeholder="Senha" class="w-full p-3 border rounded">
            <button onclick="login()" class="w-full bg-green-600 text-white p-3 rounded font-bold">Entrar</button>
            <button onclick="criar()" class="w-full text-green-600 text-sm font-bold">Criar Conta</button>
        </div>
    </div>

    <script>
        const supabase = window.supabase.createClient('https://qpgtvcjcpucqwobmfozv.supabase.co', 'sb_publishable_yEvcZWITTevvnElw6wwdRg_usqiJNwW');

        // --- CÓDIGO DO GPT: VERIFICA SE JÁ ESTÁ LOGADO ---
        (async () => {
            const { data } = await supabase.auth.getSession();
            if (data.session) {
                window.location.href = 'dashboard.html';
            }
        })();

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else window.location.href = 'dashboard.html';
        }

        async function criar() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabase.auth.signUp({ email, password });
            if (error) alert(error.message);
            else alert("Conta criada! Faça login.");
        }
    </script>
</body>
</html>
